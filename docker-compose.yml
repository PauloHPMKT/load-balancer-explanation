services:
  server1:
    build: ./server1
    container_name: server1
    expose:
      - "8081"

  server2:
    build: ./server2
    container_name: server2
    expose:
      - "8082"

  server3:
    build: ./server3
    container_name: server3
    expose:
      - "8083"

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
      - server3
