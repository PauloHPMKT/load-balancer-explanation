events {}

http {
    ## log_format is a directive that tells Nginx to format the log entries
    log_format lb '$remote_addr $upstream_addr $request_time';

    ## upstream is a group of servers that can be used to balance the load between them
    upstream backend {
    least_conn; ## This character is used to tell Nginx to use the least connections algorithm to balance the load between the servers
        server server1:8081;
        server server2:8082;
        server server3:8083;
    }

    ## server is a block that defines a server that can be used to listen for requests
    server {
        listen 8080;
        ## access_log is a directive that tells Nginx to log the requests to the access.log file
        access_log /var/log/nginx/lb.log lb;

        location / {
            ## proxy_pass is a directive that tells Nginx to proxy the request to the backend servers
            proxy_pass http://backend;
        }
    }
}

## Round Ribin: 
## Consist in giving equal weight to each server and round robin the requests between them sequentially
## Example:
## server server1:8081;
## server server2:8082;
## server server3:8083;
## This will send the request to server1, then server2, then server3, and so on.

## Weighted Round Robin:
## Consist in giving different weight to each server and round robin the requests between them
## Example:
## upstream backend {
##     weight_round_robin; ## This character is used to tell Nginx to use the weighted round robin algorithm to balance the load between the servers
##          server server1:8081 weight=5;
##          server server2:8082 weight=3;
##          server server3:8083 weight=1;
## }
## This will give 62.5% of the requests to server1, 25% of the requests to server2, and 12.5% of the requests to server3.

## Least Connections:
## Consist in sending the request to the server with the least number of connections
## Example:
## upstream backend {
##     least_conn; ## This character is used to tell Nginx to use the least connections algorithm to balance the load between the servers
##          server server1:8081;
##          server server2:8082;
##          server server3:8083;
## }
## This will send the request to server2 because it has the least number of connections, after to server 3 and so on.

## Least Response Time:
## Consist in sending the request to the server with the least response time
## Example:
## upstream backend {
##     least_time; ## This character is used to tell Nginx to use the least response time algorithm to balance the load between the servers
##          server server1:8081;
##          server server2:8082;
##          server server3:8083;
## }
## This will send the request to the server with the least response time, after to server 2 and so on.

## Sticky Round Robin:
## Consist in sending the request to the same server for the same client using a cookie or any session identifier
## Example:
## upstream backend {
##     sticky; ## This character is used to tell Nginx to use the sticky round robin algorithm to balance the load between the servers
##          server server1:8081;
##          server server2:8082;
##          server server3:8083;
## }
## This will send the request to the same server for the same client using a cookie or any session identifier, after to server 2 and so on.

